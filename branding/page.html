<script>
  document.addEventListener("DOMContentLoaded", function () {
    var f = document.getElementById("cirrus-footer");
    if (f) document.body.appendChild(f.content.cloneNode(true));

    var b = document.getElementById("cirrus-banner");
    var root = document.getElementById("root");
    if (!b || !root) return;

    function place() {
      if (document.querySelector(".runs-on-cirrus")) return true;
      var img = root.querySelector('img[src*="logo-pair"]');
      if (!img || !img.parentElement) return false;
      img.parentElement.insertAdjacentElement("afterend", b.content.firstElementChild.cloneNode(true));
      return true;
    }

    if (!place()) {
      var obs = new MutationObserver(function () {
        if (place()) obs.disconnect();
      });
      obs.observe(root, { childList: true, subtree: true });
    }
  });
</script>
