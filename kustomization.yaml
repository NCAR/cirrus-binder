apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests/externalsecret-harbor.yaml
  - manifests/ciliumnetworkpolicy-hub-apiserver.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: binder-branding
    files:
      - branding/page.html
      - branding/banner.html
      - branding/theme.css
      - branding/logo-pair.png
      - branding/favicon.ico
      - branding/NCAR-Waves.png
      - branding/NSF_Official_logo.png
      - branding/CIRRUS_Logo_NCARBlue.png
